<style>
  /* IPA glyphs (ə, ˈ, ˌ, ē …) render most reliably in Open Sans — used for the
     Merriam-Webster pronunciation badges in the explanation panel. The files
     sit beside app.html. */
  @font-face {
    font-family: "Open Sans";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("OpenSans-400-Latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
      U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193,
      U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Open Sans";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("OpenSans-400-Latin-Ext.woff2") format("woff2");
    unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB,
      U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: dark;

    /* Stone Silence — quiet dark minimal. A warm charcoal page (#131313)
       with flat surfaces separated by warm-tinted hairlines; bone reading
       text; and a single muted stone accent (#C9C2B4) for every action. No
       serif anywhere — reading surfaces and chrome share one neutral sans.
       Flat buttons, 10px cards / 8px controls, no glow, no gloss.
       Pronunciation badges keep their Merriam-Webster teal and AI violet —
       that is dictionary semantics, not theme accent, so it stays. */
    --bg: #131313;
    --surface: #1a1a19;
    --text: #e8e6e1;
    --text-2: #a3a099;
    --accent: #c9c2b4;
    --accent-hover: #d8d2c4;
    --accent-ink: #131313;
    --rec: #ff5a4d;
    --hairline: rgba(232, 230, 225, 0.09);

    /* Explanation panel + dictation */
    --border: rgba(232, 230, 225, 0.12);
    --text-soft: #c9c5bc;
    --text-dim: #6e6c66;
    --mark: rgba(255, 203, 92, 0.26);
    --word-hover: rgba(232, 230, 225, 0.07);
    /* A cool teal for pronunciation badges — a deliberate counterpoint to the
       warm stone action accent, so the two reads never get confused. */
    --pron: #8ec5d3;
    --pron-border: rgba(142, 197, 211, 0.42);
    --pron-bg: rgba(142, 197, 211, 0.1);
    --pron-fill: rgba(142, 197, 211, 0.2);
    /* A soft violet for AI-made pronunciations — when Merriam-Webster has no
       entry, the LLM supplies a best-effort respelling. A separate hue (not
       the teal MW reads as, nor the red/amber error reads) so the user can
       tell at a glance this one was generated, not looked up. */
    --pron-ai: #c3a6e8;
    --pron-ai-border: rgba(195, 166, 232, 0.5);
    --pron-ai-bg: rgba(195, 166, 232, 0.12);
    --err: #ff5a4d;
    --warn: #e8b34a;

    /* Stone Silence is all-sans: --serif is an alias of --sans so every
       reading surface (reference, explanations, notepad) renders in the
       same neutral face. */
    --serif: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
             "Helvetica Neue", Arial, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
            "Helvetica Neue", Arial, sans-serif;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    /* Fixed-height app shell: the page itself never scrolls;
       each column and the audio bar manage their own overflow. Mobile reverts
       to a normal scrolling document (see the media query below). */
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ======================================================================
     DICTATION — daily dictation sessions from PBS NewsHour (audio-only,
     1–2 sentences per session, looped), with a notepad, a WER-based
     checker, and a word-by-word explanation panel. The main region (the
     "band") holds the dictation view and the explanation panel; the session
     reference line and a full-width player bar sit at the page bottom.
     ====================================================================== */

  /* Explanation band — the page's main region, filling the whole area above the
     player. Holds the single explanation panel, anchored to the bottom
     (nearest the reference line) at a draggable height; the space above it is
     empty. */
  .explain-band {
    flex: 1 1 auto;                /* the main region: fills the area above the player */
    min-height: 0;
    overflow: visible;             /* don't clip the floating mic button / its shadow */
    display: flex;
    flex-direction: column;
    justify-content: flex-end;     /* the panel sits at the bottom, nearest the reference line */
    position: relative;
    background: color-mix(in srgb, var(--bg) 55%, var(--surface));
  }
  .explain-band[hidden] { display: none; }

  /* The single explanation panel. Anchored to the bottom of the band
     (nearest the reference line) at a draggable height (--panel-h); the space
     above is empty. It takes --panel-h (60vh, up to 85vh once dragged) but
     yields once the notepad hits a floor that actually fits topbar + textarea
     + actions. */
  .explain-panel {
    flex: 0 1 var(--panel-h, 60vh);
    min-height: 0;
    position: relative;            /* anchor for the top-edge resize handle */
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
  }

  /* Resize handle on the panel's top edge — drag up/down to change its height.
     Invisible at rest, a faint accent line on hover/drag. */
  .panel-resize {
    position: absolute;
    left: 0;
    right: 0;
    top: -5px;
    height: 11px;
    cursor: row-resize;
    z-index: 6;
    touch-action: none;
  }
  .panel-resize::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    transform: translateY(-50%);
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.13s ease;
  }
  .panel-resize:hover::after,
  .panel-resize.dragging::after { opacity: 0.55; }

  /* While dragging, suppress text selection + pointer noise. */
  body.resizing { cursor: row-resize; user-select: none; -webkit-user-select: none; }

  .explain-content {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    overflow-y: auto;
    /* Keep a scroll gesture that started in the panel inside the panel: don't let
       it chain to the page behind it when it hits the top/bottom. */
    overscroll-behavior: contain;
    padding: 20px 16px;
    font-family: var(--serif);
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--text);
  }
  .explain-content::-webkit-scrollbar { width: 10px; }
  .explain-content::-webkit-scrollbar-thumb {
    background: var(--border);
    background-clip: padding-box;
    border: 3px solid transparent;
    border-radius: 999px;
  }
  .explain-content .round p { margin: 0 0 10px; }
  .explain-content .round p:last-child { margin-bottom: 0; }
  .explain-content strong, .dictation-ref-scroll strong { font-weight: 600; color: var(--text); }
  .explain-content em, .dictation-ref-scroll em { color: var(--text-soft); font-style: italic; }
  .explain-content blockquote, .dictation-ref-scroll blockquote {
    margin: 4px 0 10px;
    padding: 2px 0 2px 14px;
    border-left: 2px solid var(--border);
    color: var(--text-soft);
    font-size: 0.95em;
  }
  .explain-content blockquote strong, .dictation-ref-scroll blockquote strong { color: var(--text); }
  .explain-content .err, .dictation-ref-scroll .err { color: var(--err); font-weight: 500; }

  .response-word {
    cursor: pointer;
    padding: 1px 2px;
    margin: 0 -2px;
    border-radius: 4px;
    transition: background 0.12s ease;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .explain-content .response-word:hover { background: var(--word-hover, rgba(255,255,255,0.08)); }
  .explain-content .response-word.marked,
  .explain-content .response-word.marked:hover {
    background: var(--mark);
    color: var(--text);
  }
  .round-block.divided {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .pron-only {
    display: flex;
    flex-wrap: wrap;
    gap: 7px 14px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .pron-only-row { display: inline-flex; align-items: center; gap: 6px; }
  .pron-only-row strong { font-weight: 600; color: var(--text); }

  /* Likelihood chip — how much of the probability mass one reading carries,
     shown only when the passage genuinely leaves the sense open and the answer
     therefore gives more than one. Deliberately NEUTRAL grey, not a new hue:
     teal already reads "from the dictionary", violet "AI-made" and orange
     "action", so a fourth colour here would look like a fourth category of
     thing rather than what it is — metadata about the sense beside it. The
     leading reading takes .lead and sits brighter, so the eye lands on the most
     likely meaning first and the alternates recede. */
  .sense-odds {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 0 7px;
    margin: 0 5px 0 6px;
    font-family: var(--sans);
    font-size: 0.7em;
    font-style: normal;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.9;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    vertical-align: baseline;
    cursor: help;
    white-space: nowrap;
  }
  .sense-odds.lead {
    color: var(--text-soft);
    border-color: var(--text-dim);
  }

  .pron-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    color: var(--pron);
    border: 1px solid var(--pron-border);
    border-radius: 100px;
    padding: 0 8px 0 10px;
    font: inherit;
    font-size: 0.9em;
    line-height: 1.7;
    cursor: pointer;
    vertical-align: baseline;
    margin: 0 2px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .pron-badge:hover { background: var(--pron-bg); }
  .pron-badge:focus-visible { outline: 2px solid var(--pron); outline-offset: 2px; }
  .pron-badge.is-playing { background: var(--pron-bg); }
  .pron-badge.loading { opacity: 0.55; cursor: progress; }
  .pron-badge.failed { border-style: dashed; cursor: help; }
  /* MW refused the request (the Cloudflare 403, a 5xx, or a network blip):
     a loud red error state — never the bare word. */
  .pron-badge.failed.err-mw { color: var(--err); border-color: rgba(255, 90, 77, 0.55); }
  .pron-badge.failed.err-mw:hover { background: rgba(255, 90, 77, 0.1); }
  /* MW answered but has no pronunciation for this word: a softer amber. */
  .pron-badge.failed.err-none { color: var(--warn); border-color: rgba(232, 179, 74, 0.55); }
  .pron-badge.failed.err-none:hover { background: rgba(232, 179, 74, 0.1); }
  .pron-badge .warn { width: 12px; height: 12px; fill: currentColor; }
  .pron-badge .err-label { font-style: normal; font-size: 0.9em; }
  /* AI-made pronunciation: Merriam-Webster had no entry, so the badge shows the
     LLM's best-effort respelling. Marked distinctly — violet, dashed, a leading
     "≈" and a trailing "AI" tag — so it never reads as a real dictionary
     pronunciation. Not playable (there is no recording), hence cursor: help. */
  .pron-badge.ai-made {
    color: var(--pron-ai);
    border-color: var(--pron-ai-border);
    border-style: dashed;
    cursor: help;
  }
  .pron-badge.ai-made:hover { background: var(--pron-ai-bg); }
  .pron-badge.ai-made .approx { font-style: normal; opacity: 0.8; margin-right: -1px; }
  .pron-badge.ai-made .ai-tag {
    font-style: normal;
    font-size: 0.62em;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 1px 4px;
    margin-left: 2px;
    border-radius: 4px;
    background: var(--pron-ai-bg);
    color: var(--pron-ai);
  }
  .pron-badge .ipa { font-style: normal; font-family: "Open Sans", inherit; }
  .pron-badge .speaker { width: 12px; height: 12px; fill: currentColor; margin-left: 1px; }
  .pron-badge .badge-pos { font-style: italic; font-size: 0.85em; color: var(--text-soft); margin-right: 1px; }
  .pron-badge .dot-loader { display: inline-block; width: 16px; text-align: center; letter-spacing: 1px; }
  .pron-variants { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .pron-badge.is-picked {
    border-color: var(--pron);
    background: var(--pron-fill);
    box-shadow: 0 0 0 1px var(--pron) inset;
  }
  .pron-badge.is-picked:hover { background: var(--pron-fill); }
  .pron-badge.is-picked .badge-pos { color: var(--pron); font-style: normal; font-weight: 700; }
  .pron-badge.is-picked .ipa { font-weight: 600; }
  .pron-variants:has(.is-picked) .pron-badge:not(.is-picked) { opacity: 0.45; }
  .pron-variants:has(.is-picked) .pron-badge:not(.is-picked):hover { opacity: 1; }

  .thinking { display: inline-flex; align-items: center; gap: 6px; padding: 8px 2px; }
  .thinking span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: thinking-pulse 1.4s ease infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.18s; }
  .thinking span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes thinking-pulse {
    0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
    40% { opacity: 0.95; transform: translateY(-3px); }
  }

  /* ---------- bottom player block (full width) ---------- */
  /* Holds the session reference line (.dictation-ref-panel), an optional
     low-credit warning, and the controls row (play · seek · loop). It is the
     bottom flex child of the body shell. */
  .player {
    position: relative;
    flex: 0 0 auto;
    padding: 7px 16px 8px;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border);
  }
  .player[hidden] { display: none; }

  /* Holds only the low-credit warning (when present), on its own line above the
     controls. Collapses to zero height when the warning is hidden. */
  .ab-titlebar { display: flex; align-items: baseline; gap: 12px; padding: 0 2px; }
  .ab-warn { font-size: 11.5px; font-weight: 500; color: var(--rec); white-space: nowrap; margin-bottom: 5px; }
  .ab-warn[hidden] { display: none; }

  /* touch-action: manipulation across the bar (and the seek track below) so a fast
     double-tap anywhere in the transport area — not just on the buttons — never
     triggers mobile double-tap-to-zoom. */
  .audiobar { position: relative; display: flex; align-items: center; gap: 13px; touch-action: manipulation; }
  /* No circle, no surface: the button IS just its icon, matching the floating
     mic button. The 34px box stays as an invisible touch target. */
  .ab-play, .ab-skip, .ab-collapse, .ab-loop {
    flex: none;
    width: 34px; height: 34px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    /* Tapping the jump buttons fast must not trigger the browser's double-tap
       zoom (mobile). Same touch hygiene the mic button uses. */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease;
  }
  /* Keyboard focus ring — there's no border/surface now, so the bare icon needs
     an outline to show focus. Matches the .pron-badge / record-button pattern. */
  .ab-skip:focus-visible,
  .ab-collapse:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  /* Play never gets one — not the accent ring above, not the browser's own
     default outline either. The dictation loop keeps focus after a mouse
     click, so hitting Space for play/pause would otherwise draw the ring
     around a button nobody tabbed to. */
  .ab-play:focus-visible, .ab-play:focus,
  .ab-loop:focus-visible, .ab-loop:focus { outline: none; }
  .ab-play { color: var(--accent); }
  .ab-play:active { transform: scale(0.94); }
  .ab-play:disabled { opacity: 0.4; cursor: default; }
  .ab-play svg { width: 20px; height: 20px; display: block; }
  /* Default state shows play, hides pause. The selector must out-specify
     `.ab-play svg { display: block }` above, hence `.ab-play .ab-ico-*`. */
  .ab-play .ab-ico-pause { display: none; }
  .audiobar.playing .ab-play .ab-ico-play { display: none; }
  .audiobar.playing .ab-play .ab-ico-pause { display: block; }
  /* ← / → jump buttons. Hidden on desktop, where the arrow keys already do this;
     revealed on mobile by the media query (which also wraps the bar so the seek
     track gets its own full-width row). */
  .ab-skip { display: none; color: var(--text-soft); }
  .ab-skip:hover { color: var(--text); }
  .ab-skip:active { transform: scale(0.94); }
  .ab-skip:disabled { opacity: 0.4; cursor: default; }
  .ab-skip svg { width: 20px; height: 20px; display: block; }
  /* Loop the dictation segment. Dim when off; when armed it becomes a
     filled stone chip (dark glyph on light accent) with a heavier stroke,
     so the on/off delta is unmissable. Disabled until a session loads. */
  .ab-loop { color: #4c4b46; border-radius: 8px; }
  .ab-loop:hover { color: var(--text); }
  .ab-loop:active { transform: scale(0.94); }
  /* After :hover deliberately — equal specificity, so the later rule wins and a
     hover cannot dim an armed loop back down to the "off" colour. */
  .ab-loop.active {
    color: var(--accent-ink);
    background: var(--accent);
  }
  .ab-loop.active:hover { color: var(--accent-ink); }
  .ab-loop.active svg { stroke-width: 2.6; }
  .ab-loop:disabled { opacity: 0.4; cursor: default; }
  .ab-loop svg { width: 20px; height: 20px; display: block; }
  /* Collapse the player (mobile only). A chevron-down that sits at the far right
     of the controls row and hides the whole player; the floating show-player
     button (.ln-fab) then brings it back. Hidden on desktop (revealed by the
     mobile media query, which also pushes it to the row's right edge). */
  .ab-collapse { display: none; color: var(--text-soft); }
  .ab-collapse:hover { color: var(--text); }
  .ab-collapse:active { transform: scale(0.94); }
  .ab-collapse svg { width: 20px; height: 20px; display: block; }

  /* Floating "show player" button (mobile only). When the player is collapsed,
     this glyph floats at the bottom-right corner — same bare-glyph style as
     the mic button: no surface, just the icon. Hidden by default; the mobile
     media query reveals it only while collapsed. */
  .ln-fab {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom));
    right: 14px;
    z-index: 55;                 /* above the band/panel; below the mic button (60) */
    display: none;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border: 0;
    background: none;
    color: var(--text-soft);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    transition: transform .16s ease, color .16s ease;
  }
  .ln-fab:active { transform: scale(0.9); }
  .ln-fab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ln-fab svg { width: 24px; height: 24px; display: block; }
  @media (hover: hover) { .ln-fab:hover { color: var(--text); } }
  /* Seek track + time as one flex unit. min-width:0 lets the track shrink inside
     it; on desktop this lays out identically to the old flat row. */
  .ab-progress { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 13px; touch-action: manipulation; }
  .ab-track {
    flex: 1 1 auto;
    height: 6px;
    border-radius: 3px;
    background: var(--hairline);
    cursor: pointer;
    overflow: hidden;
    touch-action: manipulation;   /* click-to-seek only; no double-tap zoom */
  }
  .ab-fill { height: 100%; width: 0; background: var(--accent); }
  .ab-time {
    flex: none;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text-2);
    min-width: 84px;
    text-align: right;
  }

  @media (prefers-reduced-motion: reduce) {
    .thinking span { animation: none; }
  }

  /* Stacked single-column layout on narrow screens. */
  @media (max-width: 760px) {
    /* Mobile reverts to a normal scrolling document; the player floats fixed at
       the bottom and the band fills the screen above it. */
    body { height: auto; min-height: 100dvh; overflow: visible; display: block; }

    /* The band is the page's main content: fill the screen above the fixed
       player and clear it with a matching bottom margin. Panels flow and the
       page itself scrolls (no internal band scroll on mobile). */
    .explain-band {
      /* Reserve the player's REAL height (set from JS as --player-h, which
         already includes the safe-area padding) so the fixed player never floats
         up over the band — mirroring desktop, where the player is in normal flow
         and simply pushes the band up. The fallback covers the first paint,
         before the script measures the player. */
      min-height: calc(100dvh - var(--player-h, 130px));
      overflow: visible;
      margin-bottom: var(--player-h, 130px);
    }
    /* The panel keeps the SAME draggable height as desktop (var(--panel-h)) —
       anchored at the bottom near the player with empty space above, NOT filling
       the whole band. (Dropping the desktop `flex: 0 0 var(--panel-h)` is why we
       used to fill; we now inherit it.) Resize via the handle below. */
    /* FLOAT the panel, like desktop. On desktop the page never scrolls and the
       panel is a fixed-height box pinned to the bottom while the text scrolls in
       its own box above. On mobile the whole page scrolls, so without help the
       panel would scroll away with the text and a tall notepad above an
       explanation would hide it. position:sticky pins the panel just above the
       fixed player (bottom = its reserved height) so it stays on screen while
       the notepad scrolls underneath — and, because it stays in normal flow, it
       keeps reserving its own height at the end of the band (so the last lines
       of text always clear it) and simply isn't there when no explanation
       exists yet. An opaque background (matching the band) is required since
       text scrolls beneath it; z-index sits above the text but below the fixed
       player (20) and the mic button (60). The top-edge resize handle rides
       along, so the panel is still draggable while floating. */
    .explain-panel {
      position: sticky;
      bottom: var(--player-h, 130px);
      z-index: 10;
      background: color-mix(in srgb, var(--bg) 55%, var(--surface));
    }
    /* Show the resize handle on touch: no hover to reveal it, so give it a
       persistent centered grabber and a taller, easier-to-grab hit area. */
    .panel-resize { top: -10px; height: 22px; }
    .panel-resize::after {
      opacity: 0.5;
      left: 50%; right: auto;
      width: 40px; height: 4px;
      border-radius: 2px;
      transform: translate(-50%, -50%);
    }
    .player {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 20;
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    }

    /* Touch devices have no arrow keys, so reveal the ← / → jump buttons and let
       the bar wrap: transport controls (back · play · forward · loop · hide) on
       the top row, the seek track + time on their own full-width row below — the
       standard mobile player shape, and it keeps the seek bar wide enough to
       scrub. */
    .ab-skip { display: flex; }
    /* Spread the controls evenly across the row: space-between puts the first
       transport button at the left endpoint and hide at the right endpoint. The
       seek row below is flex-basis:100% so it sits alone on its own line. */
    .audiobar { flex-wrap: wrap; row-gap: 12px; justify-content: space-between; }
    .ab-progress { flex-basis: 100%; }

    /* The three transport buttons (back · play/pause · forward) share one size,
       bigger than the side buttons (loop · hide, which stay 34px / 20px). Bare
       glyphs, so the icon size IS the visible size — and the play glyph now fills
       its box like the jump icons, so equal px reads as equal visual size. Even
       spacing across the row is handled by .audiobar's space-between above. */
    #ln-back, #ln-play, #ln-fwd { width: 44px; height: 44px; }
    #ln-back svg, #ln-play svg, #ln-fwd svg { width: 30px; height: 30px; }
    /* Un-dimmed (NOT bold): each button keeps its own colour, just at full
       strength — back/forward go from the dimmed --text-soft to --text; play
       keeps its accent orange. So the trio reads brighter than the still-dim side
       buttons (loop · hide). */
    #ln-back, #ln-fwd { color: var(--text); }

    /* ---- Collapsible player (mobile only) ----
       The whole player starts collapsed (body.player-collapsed in the markup):
       hide it and float the show-player button (.ln-fab) bottom-right to bring
       it back. Tapping the chevron (.ab-collapse) inside the controls re-adds
       the class. On desktop none of this applies — the class is a no-op there.
       (No margin needed — .audiobar's space-between lands this button at the
       row's right endpoint.) */
    .ab-collapse { display: flex; }
    body.player-collapsed .player { display: none; }
    body.player-collapsed .ln-fab { display: flex; }
  }

  /* ======================================================================
     Custom title bar — frameless window with right-aligned min/max/close
     controls (see titlebar.js). Kept visually as quiet as possible: no
     separate surface colour, just a hairline to close off the content below.
     ====================================================================== */
  .electron-titlebar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    height: 38px;
    background: var(--bg);
    border-bottom: 1px solid var(--hairline);
    -webkit-app-region: drag;
    -webkit-user-select: none;
    user-select: none;
  }
  .electron-titlebar[hidden] { display: none; }
  .electron-titlebar-controls {
    margin-left: auto;
    display: flex;
    align-self: stretch;
    -webkit-app-region: no-drag;
  }
  .electron-titlebar-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    background: transparent;
    border: none;
    padding: 0;
    color: var(--text-2);
    cursor: default;
  }
  .electron-titlebar-btn:hover { background: var(--word-hover); color: var(--text); }
  .electron-titlebar-btn-close:hover { background: var(--err); color: #fff; }
  .electron-titlebar-btn svg { width: 10px; height: 10px; }
  .electron-titlebar-btn .icon-restore { display: none; }
  .electron-titlebar-btn-max.is-maximized .icon-maximize { display: none; }
  .electron-titlebar-btn-max.is-maximized .icon-restore { display: block; }


  /* ======================================================================
     Dictation — audio-only notepad: the app's main view, a full-bleed panel
     inside .explain-band. */
  .dictation-view {
    order: -1;
    flex: 1 1 auto;
    min-height: min(280px, 40vh);
    overflow-y: auto;
    padding: 18px 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .dictation-view[hidden] { display: none; }
  .dictation-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  #dictation-next { margin-left: auto; }
  .dictation-stats {
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }
  .dictation-stats[hidden] { display: none !important; }
  .dictation-stats .sep { color: var(--text-dim); }
  .dictation-stats .due { color: var(--accent); font-weight: 600; }
  .dictation-stats .recent {
    display: inline-flex;
    gap: 3px;
    align-items: center;
  }
  /* One bar per recent score, newest last — a trend the learner can read at a
     glance, which is all the persisted score history was ever missing. */
  .dictation-stats .recent i {
    width: 4px;
    border-radius: 1px;
    background: var(--text-dim);
    display: inline-block;
  }
  .dictation-stats .recent i.good { background: var(--accent); }
  .dictation-stats .recent i.bad  { background: #c2554a; }

  /* Catch-up sync status — what the backend is doing about new episodes (see
     backend/pbs-sync.js). Quiet; hidden whenever there is nothing to say. */
  .dictation-sync {
    font-family: var(--sans);
    font-size: 11.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .dictation-sync[hidden] { display: none !important; }

  /* Speech-rate control. Zhao (1997) found learners given rate control reached
     comprehension that learners given unlimited REPETITION at full speed did
     not, and this corpus runs at a median 181 wpm — already the fast band for
     this population (Griffiths 1990). */
  .dictation-rate {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .dictation-rate[hidden] { display: none !important; }
  .dictation-rate input[type="range"] {
    width: 84px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .dictation-rate output {
    font-variant-numeric: tabular-nums;
    min-width: 30px;
    color: var(--text-soft);
  }
  .dictation-session-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }
  .dictation-session-meta[hidden] { display: none !important; }
  .dictation-title {
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 520px;
  }
  .dictation-loop-hint {
    font-family: var(--sans);
    font-size: 11.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dictation-notepad-wrap {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .dictation-textarea {
    width: 100%;
    min-height: 140px;
    max-height: 42vh;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .dictation-textarea::placeholder { color: var(--text-dim); }
  .dictation-textarea:focus { border-color: rgba(201,194,180,0.45); box-shadow: 0 0 0 3px rgba(201,194,180,0.16); }
  .dictation-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .dictation-btn {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 8px 16px;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease, transform 0.12s ease;
  }
  .dictation-btn:active { transform: scale(0.97); }
  .dictation-btn:disabled { opacity: 0.45; cursor: default; transform: none; }
  .dictation-btn.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .dictation-btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .dictation-btn.ghost {
    background: var(--surface);
    color: var(--text-soft);
    border-color: var(--border);
  }
  .dictation-btn.ghost:hover:not(:disabled) { color: var(--text); border-color: var(--text-dim); }
  /* [hidden] has to beat display, or the empty "—" pill shows whenever there is
     no grade to report. Same trap as .dictation-stats and .dictation-rate. */
  .dictation-score[hidden] { display: none !important; }
  .dictation-score {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .dictation-score .pct {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 52px;
    padding: 4px 10px;
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .dictation-score .pct.good { color: #34c759; border-color: rgba(52,199,89,0.35); }
  .dictation-score .pct.mid { color: #e8b34a; border-color: rgba(232,179,74,0.35); }
  .dictation-score .pct.bad { color: var(--err); border-color: rgba(255,90,77,0.35); }
  .dictation-score .detail { font-weight: 500; font-size: 12.5px; color: var(--text-2); }
  .dictation-result {
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--text-soft);
  }
  .dictation-result[hidden] { display: none; }
  .dictation-result .word {
    padding: 1px 3px;
    margin: 0 -1px;
    border-radius: 5px;
  }
  .dictation-result .word.correct { background: rgba(52,199,89,0.16); color: var(--text); }
  .dictation-result .word.sub { background: rgba(255,90,77,0.18); color: var(--text); text-decoration: line-through; text-decoration-color: rgba(255,90,77,0.8); }
  .dictation-result .word.ins { background: rgba(255,90,77,0.12); color: var(--err); font-style: italic; }
  .dictation-result .word.missing { background: rgba(232,179,74,0.20); color: var(--text); border: 1px dashed rgba(232,179,74,0.5); }
  .dictation-ref[hidden] { display: none; }
  .dictation-ref strong { color: var(--text); }
  .dictation-ref .dictation-ref-word {
    cursor: pointer;
    padding: 1px 2px;
    margin: 0 -2px;
    border-radius: 4px;
    transition: background 0.12s ease;
    /* The reference drives its own drag off mousedown/mousemove. Without this
       the browser's native text selection runs at the same time and fights it. */
    user-select: none;
    -webkit-user-select: none;
  }
  .dictation-ref .dictation-ref-word:hover { background: var(--word-hover, rgba(255,255,255,0.08)); }
  /* A word inside the active A-B loop (right-click a word / right-drag a phrase):
     soft accent tint plus the accent underline. Restated on this selector
     (rather than a shared rule) so it beats
     .dictation-ref .dictation-ref-word:hover the moment the cursor rests on it. */
  .dictation-ref .dictation-ref-word.looping,
  .dictation-ref .dictation-ref-word.looping:hover {
    box-shadow: inset 0 -2px 0 0 var(--accent);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 4px 4px 0 0;
  }
  /* Left-drag preview: the phrase about to be sent for an explanation, in the
     amber (--mark).

     Declared AFTER .looping deliberately. Both selectors have identical
     specificity, so order decides, and the loop paint would otherwise win the
     background on any word that is both looping and selected — making the
     preview invisible on exactly the words a learner is most likely to drag
     across. .looping's inset underline is left alone, so such a word shows the
     selection AND stays visibly inside the loop. */
  .dictation-ref .dictation-ref-word.marked,
  .dictation-ref .dictation-ref-word.marked:hover {
    background: var(--mark);
    color: var(--text);
    border-radius: 4px;
  }
  /* Reference panel — the session sentence, living INSIDE .player, first thing
     above the controls. 40px floor (one line), 26vh cap, -14px side margin
     against .player's 16px gutter with the 14px side padding put back, 2px/9px
     vertical padding, left-aligned; serif 17px/1.55, weight 600, --text. */
  .dictation-ref-panel {
    display: block;
  }
  .dictation-ref-panel[hidden] { display: none; }
  .dictation-ref-scroll {
    min-height: 40px;
    max-height: 26vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    margin: 0 -14px;
    padding: 2px 14px 9px;
    text-align: left;
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.55;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .dictation-ref-scroll::-webkit-scrollbar { width: 10px; }
  .dictation-ref-scroll::-webkit-scrollbar-thumb {
    background: var(--border);
    background-clip: padding-box;
    border: 3px solid transparent;
    border-radius: 999px;
  }
  .dictation-ref-panel .dictation-ref p {
    margin: 0 0 10px;
  }
  .dictation-ref-panel .dictation-ref p:last-child { margin-bottom: 0; }
  .dictation-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-2);
    font-family: var(--sans);
    font-size: 14px;
  }
  .dictation-empty p { margin: 0 0 12px; }
  /* An explanation panel is created on first use (makePanel) and never removed;
     resetPanelThread only empties its content box. Collapse the panel while it
     holds nothing, handle included, so an empty 60vh slab never shoves the
     notepad up the screen. */
  .explain-panel:has(> .explain-content:empty) {
    flex-basis: 0;
    min-height: 0;
    border-top: none;
  }
  .explain-panel:has(> .explain-content:empty) > .panel-resize {
    display: none;
  }
  @media (max-width: 760px) {
    .dictation-view { padding-left: 16px; padding-right: 16px; }
    .dictation-textarea { font-size: 16px; min-height: 120px; }
  }
</style>
</head>
<body class="player-collapsed">
  <!-- Custom title bar for the frameless window — shown and wired up by
       titlebar.js. -->
  <div class="electron-titlebar" id="electron-titlebar" hidden>
    <div class="electron-titlebar-controls">
      <button class="electron-titlebar-btn" id="electron-titlebar-min" type="button" aria-label="Minimize">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><line x1="1" y1="5" x2="9" y2="5"/></svg>
      </button>
      <button class="electron-titlebar-btn electron-titlebar-btn-max" id="electron-titlebar-max" type="button" aria-label="Maximize">
        <svg class="icon-maximize" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="1" y="1" width="8" height="8"/></svg>
        <svg class="icon-restore" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="1" y="2.5" width="6.5" height="6.5"/><path d="M3.5 2.5V1H9v6.5H7.5"/></svg>
      </button>
      <button class="electron-titlebar-btn electron-titlebar-btn-close" id="electron-titlebar-close" type="button" aria-label="Close">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
      </button>
    </div>
  </div>

  <!-- Explanation band — the page's main region. Fills the whole area above the
       player and holds the single explanation panel (injected at runtime, see
       makePanel), anchored to the bottom at a draggable height. -->
  <div class="explain-band" id="ln-explain-band">
    <!-- Dictation — audio-only notepad (1–2 sentences per session).
         The whole PBS NewsHour segment is streamed but the player loops only
         on the active session (see app-dictation.js). -->
    <div class="dictation-view" id="dictation-view" hidden>
      <div class="dictation-topbar">
        <div class="dictation-session-meta" id="dictation-session-meta" hidden>
          <span class="dictation-title" id="dictation-title"></span>
          <span class="dictation-loop-hint" id="dictation-loop-hint" hidden><span id="dictation-loop-range"></span></span>
        </div>
        <span class="dictation-rate" id="dictation-rate-wrap" hidden>
          <label for="dictation-rate">Speed</label>
          <input type="range" id="dictation-rate" min="60" max="100" step="5" value="100"
                 title="Slow the audio without changing pitch">
          <output id="dictation-rate-val">1.0×</output>
        </span>
        <span class="dictation-stats" id="dictation-stats" hidden></span>
        <span class="dictation-sync" id="dictation-sync" hidden></span>
        <button class="dictation-btn ghost" id="dictation-next" type="button" title="Next session — records the attempt, does not retire it">Next →</button>
      </div>
      <div class="dictation-notepad-wrap" id="dictation-notepad-wrap" hidden>
        <textarea class="dictation-textarea" id="dictation-input" placeholder="Type what you hear…" rows="6" spellcheck="false" autocomplete="off"></textarea>
        <div class="dictation-actions">
          <button class="dictation-btn primary" id="dictation-check" type="button">Check</button>
          <button class="dictation-btn ghost" id="dictation-reveal" type="button" hidden>Reveal transcript</button>
          <span class="dictation-score" id="dictation-score" hidden>
            <span class="pct" id="dictation-pct">—</span>
            <span class="detail" id="dictation-detail"></span>
          </span>
        </div>
        <div class="dictation-result" id="dictation-result" hidden></div>
      </div>
      <div class="dictation-empty" id="dictation-empty" hidden>
        <p id="dictation-empty-msg">No dictation sessions available.</p>
        <button class="dictation-btn primary" id="dictation-retry" type="button">Retry</button>
      </div>
    </div>

  </div>

  <!-- Full-width player block, pinned to the page bottom: the session
       reference line on top, then the controls row (play · seek · loop). A
       low-credit warning, when present, shows just above the controls. -->
  <div class="player" id="ln-player" hidden>
    <!-- Dictation Reference — the session sentence, shown after
         Check → Reveal; see showDictRef in app-dictation.js. Left-click a word
         (or drag across several) to ask the explanation panel about it;
         right-click / right-drag to A-B loop it. -->
    <div class="dictation-ref-panel" id="dictation-ref-panel" hidden>
      <div class="dictation-ref-scroll" id="dictation-ref-scroll">
        <div class="dictation-ref" id="dictation-ref" hidden></div>
      </div>
    </div>
    <div class="ab-titlebar">
      <span class="ab-warn" id="ln-warn" hidden></span>
    </div>
    <div class="audiobar" id="ln-bar">
      <!-- Jump back 5s. Mirrors the ← arrow key for touch devices, which have no
           keyboard. Hidden on desktop (CSS); shown on mobile, where the bar wraps
           the seek track down to its own row. -->
      <button class="ab-skip" id="ln-back" type="button" aria-label="Back 5 seconds" title="Back 5s" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><text x="12" y="15.6" text-anchor="middle" font-size="9" font-weight="700" stroke="none" fill="currentColor">5</text></svg>
      </button>
      <button class="ab-play" id="ln-play" type="button" aria-label="Play" disabled>
        <svg class="ab-ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16a1 1 0 0 0 1.55.85l12.5-8a1 1 0 0 0 0-1.7l-12.5-8A1 1 0 0 0 7 4z" fill="currentColor"/></svg>
        <svg class="ab-ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.4" y="3.5" width="4.2" height="17" rx="1.7" fill="currentColor"/><rect x="13.4" y="3.5" width="4.2" height="17" rx="1.7" fill="currentColor"/></svg>
      </button>
      <!-- Jump forward 5s. Mirrors the → arrow key (see #ln-back). -->
      <button class="ab-skip" id="ln-fwd" type="button" aria-label="Forward 5 seconds" title="Forward 5s" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/><text x="12" y="15.6" text-anchor="middle" font-size="9" font-weight="700" stroke="none" fill="currentColor">5</text></svg>
      </button>
      <!-- Loop the dictation segment. It sits here rather than in the
           notepad's Check/Reveal row because looping is a transport concern; it
           belongs beside Play, not beside the grading buttons. Starts disabled —
           there is nothing to loop until a session has loaded. -->
      <button class="ab-loop" id="dictation-loop" type="button" aria-pressed="false" aria-label="Loop this segment" title="Loop this segment continuously" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <!-- Hide the whole player (mobile only). Sits with the transport controls;
           tapping it collapses the player down to the floating show-player button
           (#ln-fab), which brings it back. Hidden on desktop (CSS). -->
      <button class="ab-collapse" id="ln-collapse" type="button" aria-label="Hide player" title="Hide player" aria-controls="ln-player" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <!-- Seek track + time. Wrapped so the pair can drop to a second row on
           mobile as one unit (see the audiobar wrap rule) while staying inline on
           desktop. -->
      <div class="ab-progress">
        <div class="ab-track" id="ln-track"><div class="ab-fill" id="ln-fill"></div></div>
        <span class="ab-time" id="ln-time">0:00 / 0:00</span>
      </div>
      <audio id="ln-audio"></audio>
    </div>
  </div>

  <!-- Floating "show player" button (mobile only). When the player is collapsed
       (body.player-collapsed) this icon floats at the bottom-right — styled
       like the mic button — and tapping it brings the whole player
       (reference · controls · seek) back. Hidden on desktop and whenever the
       player is open (CSS). -->
  <button class="ln-fab" id="ln-fab" type="button" aria-label="Show player" title="Show player" aria-controls="ln-player" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/>
      <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/>
      <circle cx="12" cy="12" r="2"/>
      <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/>
      <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/>
    </svg>
  </button>

<!-- Electron shell: wires up the custom title bar above. Runs before the app
     scripts on purpose, though order doesn't matter to either side. -->
<script src="titlebar.js"></script>

<!-- app-base.js FIRST: resolves this app's own backend base URL for every
     apiBase() call site below. -->
<script src="app-base.js"></script>
<!-- Transport + explanation panel: the shared <audio> player bar and the
     word/phrase explanation engine dictation looks words up in. -->
<script src="app-player.js"></script>
<!-- The floating microphone button — see mic.js's own header. Uses
     app-base.js's apiBase() for transcription and app-dictation.js's
     window.__dictationInsertAndCheck bridge (loaded below) for the card's
     "Insert and check" action. -->
<script src="mic.js"></script>
<!-- Daily Dictation — audio-only 1–2 sentence loops from PBS NewsHour,
     with a WER-based checker. See backend/dictation.js for the scoring
     definition; this file owns the notepad UI and its loop. -->
<script src="app-dictation.js"></script>
</body>
</html>
